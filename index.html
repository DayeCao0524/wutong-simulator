<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>枫叶模拟器｜8.12 试玩版</title>
<style>
/* =========================================
   枫叶模拟器 UI v0.1
   ========================================= */

/* ---------- 全局 ---------- */

html,
body {
    min-height: 100%;
}

body {
    margin: 0;

    background:
        radial-gradient(
            circle at top,
            rgba(45, 58, 78, 0.55),
            rgba(14, 17, 23, 0.96) 55%
        );

    background-attachment: fixed;

    color: #eeeeee;

    font-family:
        "PingFang SC",
        "Microsoft YaHei",
        "Noto Sans SC",
        Arial,
        sans-serif;

    font-size: 18px;
    line-height: 1.85;

    letter-spacing: 0.02em;
}


/* ---------- SugarCube 主区域 ---------- */

#story {
    margin-left: 0;
}

#passages {
    max-width: 860px;

    margin: 55px auto;

    padding: 38px 48px;

    background: rgba(20, 24, 32, 0.88);

    border: 1px solid rgba(255, 255, 255, 0.08);

    border-radius: 18px;

    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.45);

    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
}


/* ---------- Passage 切换动画 ---------- */

.passage {
    animation: passageFadeIn 0.35s ease;
}

@keyframes passageFadeIn {

    from {
        opacity: 0;
        transform: translateY(7px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}


/* ---------- 普通文字 ---------- */

p {
    margin-top: 0;
    margin-bottom: 1.15em;
}

strong,
b {
    color: #ffffff;
}

em,
i {
    color: #d6dce8;
}


/* ---------- Twine 选项 ---------- */

a.link-internal {
    display: block;

    margin: 14px 0;

    padding: 14px 18px;

    color: #dce8ff;

    background:
        linear-gradient(
            90deg,
            rgba(77, 111, 177, 0.20),
            rgba(71, 93, 145, 0.11)
        );

    border:
        1px solid rgba(126, 165, 234, 0.30);

    border-radius: 11px;

    text-decoration: none;

    box-shadow:
        0 3px 12px rgba(0, 0, 0, 0.12);

    transition:
        transform 0.18s ease,
        background 0.18s ease,
        border-color 0.18s ease,
        color 0.18s ease;
}


/* 鼠标悬停 */

a.link-internal:hover {

    color: #ffffff;

    background:
        linear-gradient(
            90deg,
            rgba(81, 124, 211, 0.40),
            rgba(68, 104, 176, 0.24)
        );

    border-color:
        rgba(151, 188, 255, 0.68);

    transform: translateX(5px);
}


/* 已访问链接不要变成紫色 */

a.link-visited {
    color: #dce8ff;
}


/* ---------- 灰色不可选择项 ---------- */

.disabled-option {
    display: block;

    margin: 14px 0 4px;

    padding: 14px 18px;

    color: #777f8c;

    background: rgba(110, 110, 110, 0.08);

    border:
        1px solid rgba(160, 160, 160, 0.13);

    border-radius: 11px;

    cursor: not-allowed;

    user-select: none;

    opacity: 0.72;
}


/* 前置条件 */

.requirement {
    display: block;

    margin:
        -1px 0
        11px 18px;

    color: #858c99;

    font-size: 0.82em;

    font-style: italic;
}


/* ---------- 属性变化 ---------- */

.stat-up {
    display: inline-block;

    color: #77dc93;

    font-weight: 600;
}

.stat-down {
    display: inline-block;

    color: #ff8787;

    font-weight: 600;
}

.relationship-up {
    display: inline-block;

    color: #ff9ecb;

    font-weight: 600;
}

.relationship-down {
    display: inline-block;

    color: #dd89a9;

    font-weight: 600;
}


/* ---------- 系统提示 ---------- */

.system-msg {

    margin: 18px 0;

    padding: 11px 15px;

    color: #bdd5ff;

    background: rgba(74, 108, 174, 0.13);

    border-left:
        3px solid rgba(112, 159, 245, 0.85);

    border-radius: 4px;

    font-size: 0.9em;
}


/* ---------- 剧情章节标题 ---------- */

.chapter-title {

    margin-bottom: 28px;

    padding-bottom: 12px;

    border-bottom:
        1px solid rgba(255, 255, 255, 0.12);
}

.chapter-title .chapter {

    color: #8eaee3;

    font-size: 0.78em;

    letter-spacing: 0.18em;
}

.chapter-title .title {

    margin-top: 5px;

    color: #ffffff;

    font-size: 1.55em;

    font-weight: 600;
}


/* ---------- 地点 / 时间 ---------- */

.scene-info {

    margin-bottom: 20px;

    color: #939baa;

    font-size: 0.82em;

    letter-spacing: 0.08em;
}


/* ---------- 对话 ---------- */

.dialogue {

    margin: 18px 0;

    padding-left: 16px;

    border-left:
        2px solid rgba(255, 255, 255, 0.18);

    color: #f0f0f0;
}


/* ---------- SugarCube 左侧菜单 ---------- */

#ui-bar {
    background: #11151c;

    border-right:
        1px solid rgba(255, 255, 255, 0.07);
}

#story-title {
    color: #ffffff;
}

#menu ul {
    border-color:
        rgba(255, 255, 255, 0.08);
}

#menu li a {
    color: #b7c2d6;
}

#menu li a:hover {
    background: rgba(255, 255, 255, 0.06);

    color: #ffffff;
}


/* ---------- 滚动条 ---------- */

\::-webkit-scrollbar {
    width: 9px;
}

\::-webkit-scrollbar-track {
    background: #11151c;
}

\::-webkit-scrollbar-thumb {
    background: #3b4351;

    border-radius: 8px;
}

\::-webkit-scrollbar-thumb:hover {
    background: #505b6d;
}


/* ---------- 手机适配 ---------- */

@media screen and (max-width: 700px) {

    body {
        font-size: 16px;

        line-height: 1.75;
    }

    #passages {

        margin:
            18px 10px
            30px;

        padding:
            25px 19px;

        border-radius: 14px;
    }

    a.link-internal {

        margin: 12px 0;

        padding: 14px 15px;
    }

    .disabled-option {

        padding: 14px 15px;
    }

    .chapter-title .title {
        font-size: 1.35em;
    }
}

:root{
  --bg:#0b0f16; --panel:rgba(18,24,34,.92); --panel2:rgba(25,33,46,.9);
  --line:rgba(255,255,255,.09); --text:#edf2f7; --muted:#94a3b8;
  --accent:#82aaff; --good:#83e1a5; --danger:#ff8f91;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0!important; color:var(--text)!important;
  background:
    radial-gradient(circle at 20% -10%,rgba(62,91,140,.35),transparent 36rem),
    linear-gradient(145deg,#0a0e15,#101722 60%,#0b1018)!important;
  font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif!important;
}
#ui-bar{display:none!important}
#story{margin:0!important}
.game-shell{min-height:100vh;display:grid;grid-template-columns:280px minmax(0,900px);gap:28px;justify-content:center;padding:34px 24px 70px}
.sidebar{position:sticky;top:24px;align-self:start}
.brand{padding:20px 20px 17px;border:1px solid var(--line);border-radius:18px;background:rgba(13,18,26,.78);box-shadow:0 18px 50px rgba(0,0,0,.25)}
.brand-kicker{font-size:11px;letter-spacing:.28em;color:#91a6c7}
.brand-title{font-size:24px;font-weight:760;margin-top:4px}
.brand-sub{font-size:12px;color:var(--muted);margin-top:5px}
.status-card,.control-card{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:16px;background:rgba(13,18,26,.72)}
.card-title{font-size:12px;letter-spacing:.12em;color:#9db2cf;margin-bottom:12px}
.stat-row{display:grid;grid-template-columns:66px 1fr 34px;gap:8px;align-items:center;margin:9px 0;font-size:13px}
.stat-row .label{color:#b9c5d6}
.stat-row .value{text-align:right;color:#dce6f5;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#6e8fc8,#94b8ff)}
.resource-row{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid rgba(255,255,255,.06);font-size:13px}
.resource-row:first-of-type{border-top:0}
.resource-row span:first-child{color:#aeb9c8}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.control-btn{border:1px solid rgba(153,178,216,.2);background:rgba(77,98,132,.14);color:#cbd9ec;padding:9px 10px;border-radius:10px;cursor:pointer;font:inherit;font-size:12px}
.control-btn:hover{background:rgba(95,126,179,.24);color:#fff}
.main-stage{min-width:0}
.topline{display:flex;justify-content:space-between;align-items:center;margin:2px 2px 14px;color:#7f91ab;font-size:12px;letter-spacing:.08em}
#passages{
  max-width:none!important;margin:0!important;padding:42px 48px!important;
  background:rgba(17,23,33,.91)!important;border:1px solid var(--line)!important;
  border-radius:20px!important;box-shadow:0 24px 70px rgba(0,0,0,.38)!important;
  backdrop-filter:blur(14px);
}
.passage{font-size:17px;line-height:1.95}
.passage h2{font-size:26px;line-height:1.35;margin:0 0 22px}
.passage a.link-internal{
  position:relative;display:block!important;margin:13px 0!important;padding:14px 42px 14px 17px!important;
  background:linear-gradient(90deg,rgba(71,100,153,.22),rgba(66,83,117,.11))!important;
  border:1px solid rgba(126,165,234,.28)!important;border-radius:11px!important;
  color:#dce8ff!important;text-decoration:none!important;cursor:pointer;
}
.passage a.link-internal::after{content:"›";position:absolute;right:17px;top:50%;transform:translateY(-52%);font-size:22px;color:#849bc0}
.passage a.link-internal:hover{transform:translateX(4px);background:linear-gradient(90deg,rgba(81,124,211,.34),rgba(68,104,176,.20))!important}
.stat-flash{margin:16px 0;padding:10px 13px;border-left:3px solid #7ea6e8;background:rgba(80,119,182,.10);color:#c8d8ef;border-radius:5px;font-size:14px}
.error-box{padding:16px;border:1px solid rgba(255,120,120,.3);background:rgba(150,50,50,.12);border-radius:10px;color:#ffd0d0}
.footer-note{text-align:center;color:#59687d;font-size:11px;margin-top:14px}
@media(max-width:900px){
 .game-shell{grid-template-columns:1fr;padding:18px 12px 50px}
 .sidebar{position:static;display:grid;grid-template-columns:1fr 1fr;gap:10px}
 .brand{grid-column:1/-1}.status-card,.control-card{margin-top:0}
 #passages{padding:28px 22px!important}
}
@media(max-width:560px){
 .sidebar{display:block}.status-card,.control-card{margin-top:10px}
 .passage{font-size:16px}#passages{padding:24px 17px!important}
}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);padding:9px 14px;border-radius:999px;background:rgba(17,24,36,.96);border:1px solid rgba(255,255,255,.1);color:#dce7f6;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20}
</style>
</head>
<body>
<div class="game-shell">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-kicker">MAPLE SIMULATOR</div>
      <div class="brand-title">枫叶模拟器</div>
      <div class="brand-sub">8.12 UI 试玩构建</div>
    </div>
    <div class="status-card">
      <div class="card-title">玩家状态</div>
      <div id="stats"></div>
      <div class="resource-row"><span>资金</span><strong>¥ <span id="money">0</span></strong></div>
      <div class="resource-row"><span>阶段</span><strong id="year-sem">高一 · 第1学期</strong></div>
    </div>
    <div class="control-card">
      <div class="card-title">游戏</div>
      <div class="controls">
        <button class="control-btn" onclick="saveGame()">保存</button>
        <button class="control-btn" onclick="loadGame()">读取</button>
        <button class="control-btn" onclick="goBack()">返回</button>
        <button class="control-btn" onclick="restart()">重开</button>
      </div>
    </div>
  </aside>
  <main class="main-stage">
    <div class="topline"><span id="passage-id"></span><span>选择会改变后续经历</span></div>
    <div id="passages"><div id="passage" class="passage"></div></div>
    <div class="footer-note">单文件离线试玩版 · 存档保存在当前浏览器</div>
  </main>
</div>
<div id="toast"></div>
<script>
const PASSAGES = {"ACTION_GAME": "<<set $action_done = true>>\n<<set $action_count += 1>>\n\n你决定把这段时间献给电子游戏。\n\n周五晚上。\n\n“最后一把。”\n\n凌晨一点。\n\n“最后一把。”\n\n凌晨三点。\n\n“赢一把就睡。”\n\n第二天中午，你睁开眼睛。\n\n很好。\n\n至少昨天最后确实没有再输。\n\n因为你掉线了。\n\n<<set $social = Math.min(100, $social + 2)>>\n<<set $mentalhealth = Math.max(0, $mentalhealth - 3)>>\n\n社交 +2  \n健康 -3\n\n[[继续->EVT_MONTH1_START]]", "ACTION_HEALTH": "<<set $powerlevel = Math.min(100, $powerlevel + 8)>>\n<<set $action_done = true>>\n<<set $action_count += 1>>\n\n你决定锻炼身体。\n\n第一天你雄心壮志。\n\n第二天你浑身酸痛。\n\n第三天你开始重新思考体育运动存在的意义。\n\n但你还是坚持了下来。\n\n至少现在爬楼不会有一种人生走到尽头的感觉。\n\n武力 +8\n\n[[继续->EVT_MONTH1_START]]", "ACTION_LINXI": "<<set $action_done = true>>\n<<set $action_count += 1>>\n\n<<if $linxi_stage is 0>>\n\n    <<set $rel_linxi = Math.min(100, $rel_linxi + 8)>>\n    <<set $linxi_stage = 1>>\n    <<set $flag_linxi_blackout = true>>\n\n    那天晚自习，教学楼突然停电了。\n\n    整个教室一下黑了下来。\n\n    前排有人开始起哄。\n\n    后排已经有人在喊：\n\n    “老师！是不是可以下课了！”\n\n    你还没反应过来，旁边的林曦突然转过头。黑暗里，你其实看不清她的脸。\n\n    你的目光不自觉地落在她在黑暗中模糊的轮廓。\n\n    反正在黑暗里。 肆无忌惮一点应该也没关系。\n\n    你甚至开始觉得停电也挺好的。\n\n    下一秒——\n\n    一束手机手电筒突然从旁边扫了过来。\n\n    白光正好照在你们两个脸上。\n\n    你这才发现。\n\n    林曦也一直在看你。\n\n    她也发现你一直在看她。\n\n    ……\n\n    光移走了。\n\n    两个人同时转了回去。\n\n    谁也没说话。\n\n    但不知道为什么。你突然有点想让这次停电再久一点。\n\n    林曦关系 +8\n\n    [[继续->EVT_MONTH1_START]]\n\n<<else>>\n\n    <<set $rel_linxi = Math.min(100, $rel_linxi + 5)>>\n\n    这次事件过后，\n\n    你和林曦说话越来越多。\n\n    有时候是作业。\n\n    有时候是老师。\n\n    有时候其实也没什么正事。\n\n    但你路过她座位的时候，\n\n    已经会很自然地停下来聊两句。\n\n    更麻烦的是——\n\n    她好像也已经习惯了。\n\n    林曦关系 +5\n\n    [[继续->EVT_MONTH1_START]]\n\n<</if>>", "ACTION_STUDY": "<<set $academic = Math.min(100, $academic + 8)>>\n<<set $action_done = true>>\n<<set $action_count += 1>>\n\n你决定认真学习一段时间。\n\n不是那种“今天开始我要重新做人”的认真。\n\n是真的开始写作业。甚至提前写。\n\n甚至你不满足于只在作业中获取知识，每晚你还还学习雅思。\n\n你第一次感受到了一种陌生的情绪。知识在你贫瘠的大脑中疯狂繁殖。\n\n学术 +8\n\n[[继续->EVT_MONTH1_START]]", "Action Sheet": "<h2>这半年，你把时间花在……</h2>\n\n枫叶的生活渐渐有了规律。\n\n上课，晚自习，周末。\n\n除此之外，你也开始有了一点真正属于自己的时间。\n\n你不可能什么都做。\n\n<<if $action_done is false>>\n\n[[认真学习->ACTION_STUDY]]\n\n[[锻炼身体->ACTION_HEALTH]]\n\n[[去找林曦->ACTION_LINXI]]\n\n[[打游戏->ACTION_GAME]]\n\n\n<<else>>\n\n你这学期已经做过选择了。\n\n[[继续->EVT_MONTH1_START]]\n\n<</if>>", "EVT_001": "第二天，你站在教学楼里，手上拿着昨天晚上发下来的课表。\n\n和以前的学校不太一样，这里没有固定在一个教室里上一整天课。\n\n每节课开始前，你都要按照课表前往对应的教室。数学、Science、Literature……不同课程可能在完全不同的地方。\n\n走廊两侧还有一排排 Locker。\n\n每个学生都有属于自己的 Locker，可以把英文教材、水杯和一些平时用的东西放进去。\n\n你低头重新看了一眼课表。\n\n第一天，至少得先搞明白这里到底是怎么运转的。\n\n[[先把课表和 Locker 的位置记清楚->EVT_001_A]]\n\n[[跟旁边同学聊聊，顺便问问怎么走班->EVT_001_B]]", "EVT_001_A": "<<set $oriented = true>>\n\n你沿着走廊走了一圈，把几个主要教室和自己的 Locker 位置记了下来。\n\n至少先把每天要去哪里弄明白。\n\n[[去上课->EVT_004]]", "EVT_001_B": "<<set $social_start = true>>\n\n你随手找了个看起来也是新生的人问了几句。\n\n对方指了指课表，又告诉你哪几栋教学楼最容易走错。\n\n有人带着走，总比自己研究快。\n\n<<set $social = Math.min(100, $social + 2)>>\n\n''社交能力 +2''\n\n[[去上课->EVT_004]]", "EVT_002": "父母把你送到学校门口之后就离开了，你仰头看着大门上的烫金大字：梧桐国际学校。下午阳光很大，招牌反射阳光，晃得你睁不开眼。\n\n宿舍楼里到处都是拖着行李的新生。\n\n你找到自己的房间时，一个年纪已经不小的男人正在里面帮忙收拾床铺。\n\n他姓张，叫张建国，是这栋楼的宿管。\n\n六七十岁的样子，说话带着很重的山东口音。\n\n“东西先放那边，床铺好了再慢慢收拾。”\n\n他说着，又伸手帮你把床垫的位置正了正。\n\n这是你第一次见到以后几乎每天晚上都会碰到的人。\n\n[[主动跟张建国打招呼，顺手帮他一起整理床铺->EVT_002_A]]\n\n[[礼貌道谢，之后自己收拾->EVT_002_B]]\n\n[[没太在意，先去和室友聊聊->EVT_002_C]]", "EVT_002_A": "<<set $rel_zhang += 2>>\n\n“叔，我来吧。”\n\n你过去搭了把手，又和他聊了几句。\n\n张建国抬头看了看你，用很浓的山东口音说：\n\n“好好好，小伙子挺勤快。”\n\n他明显记住了你。\n\n''张建国好感：'' $rel_zhang\n\n[[收拾完去吃饭->EVT_005]]", "EVT_002_B": "<<set $rel_zhang += 1>>\n\n你跟张建国道了声谢，然后自己开始整理剩下的东西。\n\n他点了点头，又去帮其他新生。\n\n至少给宿管留下了个懂礼貌的印象。\n\n''张建国好感：'' $rel_zhang\n\n[[去食堂吃饭->EVT_005]]", "EVT_002_C": "<<set $dorm_social_start = true>>\n\n你把东西往床边一放，很快就和房间里的其他人聊了起来。\n\n张建国继续忙自己的。\n\n你没怎么和他说话，但倒是先和室友熟了起来。\n\n''张建国好感：'' $rel_zhang\n\n[[和室友一起去食堂->EVT_005]]", "EVT_003": "晚饭后，你回到班级教室。\n\n这是第一次晚自习。\n\n一个叫 Clark 的领事站在讲台前。\n\n领事差不多相当于这里的班主任，同时也负责请假、纪律和各种学生事务。\n\nClark 开始给所有人讲学校的规矩。\n\n(text-colour:red)[22：00前必须回宿舍。]\n\n(text-colour:red)[出校园要经过谁批准。]\n\n(text-colour:red)[违反纪律会记过，记过两次就会被开除。]\n\n台下有人认真听，也有人明显没太当回事。\n\n你慢慢意识到——\n\n如果以后想在学校里过得自由一点，跟这个人的关系恐怕不会完全没用。\n\n[[认真听完，把请假和纪律要求记下来->EVT_003_A]]\n\n[[表面听着，私下和同学吐槽这些规矩->EVT_003_B]]\n\n[[直接问清楚：周末出校和请假到底怎么批？->EVT_003_C]]", "EVT_003_A": "<<set $rel_clark += 1>>\n<<set $leave_rules_known = true>>\n\n你把几个重要的规定记了下来。\n\nClark偶尔扫过教室，看到你至少还在认真听。\n\n他对你的配合没什么意见。\n\n''Clark 好感：'' $rel_clark\n\n[[结束第一天，第二天开始正式上课->EVT_001]]", "EVT_003_B": "<<set $rules_skeptical = true>>\n\n你表面上听着，实际上没觉得这些规定有多重要。\n\n旁边也有人小声吐槽。\n\n规矩先听着。\n\n至于以后照不照做——以后再说。\n\n''Clark 好感：'' $rel_clark\n\n[[结束第一天，第二天开始正式上课->EVT_001]]", "EVT_003_C": "<<set $leave_rules_known = true>>\n<<set $clark_direct = true>>\n\n你举手。\n\n“周末如果想出去，请假具体怎么批？”\n\nClark停了一下，把流程重新解释了一遍。\n\n他没有说什么，只是多看了你一眼。\n\n至少你现在知道，以后想出校门该找谁了。\n\n''Clark 好感：'' $rel_clark\n\n[[结束第一天，第二天开始正式上课->EVT_001]]", "EVT_004": "你按照课表找到 Literature 教室。\n\n站在前面的是 Mr. Graves。\n\n光头，中年，长相神似绝命毒师里的Mr.White。\n\n上课铃响以后，他几乎没有给大家适应的时间。\n\n整个课堂，从第一句话开始，就是英语。\n\n先是自我介绍。\n\n然后 Graves 发下来一份打印好的英文材料。\n\n你粗略翻了翻。\n\n两三千词。\n\n接下来还要做赏析、分析，讨论，甚至仿写。\n\n教室里的反应很明显。\n\n有人听得一脸茫然。\n\n有人勉强能跟上。\n\n也有极少数人，像那个大家后来叫“伦敦腔”的学生一样，英语说得几乎不像中国高中生。\n\n你第一次真正意识到：\n\n虽然这里是国际学校，但学生之间的英语和学术能力差距非常大。\n\n而 Graves 的课，本身也绝对不简单。\n\n[[尽量用完整英文自我介绍，认真跟上课堂->EVT_004_A]]\n\n[[自我介绍说短一点，先观察别人怎么应付->EVT_004_B]]\n\n[[听不懂的地方直接举手问 Graves->EVT_004_C]]", "EVT_004_A": "<<set $rel_graves += 3>>\n<<set $academic += 2>>\n<<set $graves_effort = true>>\n\n你尽量把自我介绍说完整。\n\n之后开始硬着头皮跟 Graves 的节奏。\n\n很多地方还是很吃力。\n\n但至少 Graves 知道你在认真跟。\n\n''Graves 好感：'' $rel_graves\n\n''学术能力：'' $academic\n\n[[努力听讲->EVT_006]]", "EVT_004_B": "<<set $class_observer = true>>\n\n你没有急着表现。\n\n自我介绍简单说了几句，然后开始观察周围的人。\n\n很快你发现，自己并不是唯一一个跟不上 Graves 的人。\n\n有人甚至比你听得还费劲。\n\n当然，也有人完全是另一个水平。\n\n你大概摸清楚了这个班的学术生态。\n\n''Graves 好感：'' $rel_graves\n\n''学术能力：'' $academic\n\n[[现在知道谁是真大腿了->EVT_006]]", "EVT_004_C": "<<set $rel_graves += 2>>\n<<set $academic += 1>>\n<<set $graves_asked_question = true>>\n\n你犹豫了一下，还是举起手。\n\n用英语问了一个自己没听懂的问题。\n\n表达得不算漂亮。\n\nGraves回答了你。\n\n问题不一定问得好，但至少你没有坐在那里装懂。\n\n''Graves 好感：'' $rel_graves\n\n''学术能力：'' $academic\n\n[[我唯一所知的就是我一无所知->EVT_006]]", "EVT_005": "晚饭时间，食堂已经挤满了人。\n\n这里不是统一打饭，而是一排排不同的窗口。\n\n炒饭、面、盖饭、各种小炒，看起来比你原来的学校选择多得多。\n\n价格倒不算离谱。\n\n早餐通常不到十块，午饭和晚饭大概十五到二十块。\n\n轮到谁，谁就把饭卡往机器上一刷。\n\n窗口前的人排得很长，后面还不断有人往里挤。\n\n你看了看手里的饭卡。\n\n[[排队刷卡，先看看食堂都有什么饭->EVT_005_A]]\n\n[[找排在前面的室友，蹭饭卡吃一顿，事后再微信转账->EVT_005_B]]", "EVT_005_A": "<<set $cafeteria_known = true>>\n\n你跟着队伍一点点往前挪。\n\n刷卡，拿饭，找位置。\n\n十几块钱一顿，窗口不少，人也是真的多。\n\n以后必须得早点来。\n\n[[晚饭后去晚自习->EVT_003]]", "EVT_005_B": "<<set $cafeteria_known = true>>\n<<set $dorm_social_start = true>>\n\n你端着饭和室友找了一张四人桌坐下。\n\n食堂里很吵，旁边全是说话声和餐盘碰撞的声音。\n\n大家一边吃，一边聊今天报到碰到的人和事情。\n\n这是你们真正开始熟起来的第一顿饭。\n\n<<set $social = Math.min(100, $social + 2)>>\n\n''社交能力 +2''\n\n[[吃完去晚自习->EVT_003]]", "EVT_006": "你上完五节课，现在是15：45，走廊里很快重新热闹起来。\n\n距离晚饭和晚自习还有一段时间。\n\n有人抱着书往宿舍走，有人直接往操场跑，也有人干脆留在教室继续写作业。\n\n你第一次发现，在梧桐，下课并不意味着一天结束。\n\n你打算活动活动身体。\n\n你打算——\n\n[[去足球场看看->EVT_010]]\n[[去篮球场看看->EVT_040]]\n[[自己随便跑几圈->EVT_041]]", "EVT_010": "你往足球场走了过去。\n\n场上已经有七八个人在踢。\n\n没有统一队服，也不像正式训练，更像是放学以后临时凑起来的一场野球。\n\n有人穿着球鞋，也有人直接穿着校服裤子在场上跑。\n\n你在边上看了一会儿。有一个高个看着很眼熟。\n\n你认出来了。\n\n是之前在班里见过的岩子。\n\n<<if $social_start>>\n他显然也认出了你。\n\n“你不是之前问过走班那个吗？来不来？”\n<</if>>\n\n[[下场一起踢->EVT_011]]\n\n[[我不会踢，我就看看->EVT_012]]\n\n<span class=\"disabled-option\">直接问他们是不是校队</span>\n<span class=\"requirement\">[需要：已经和足球场上的人熟悉]</span>", "EVT_011": "你在初中的时候踢过球，你决定一起踢一会儿。\n\n<<set $rel_yanzi = Math.min(100, $rel_yanzi + 2)>>\n\n<<set $met_yanzi_football = true>>\n\n天还没有完全黑，操场上的人却越来越多。\n\n瘦竹竿得身材让他的重心比其他人高，岩子踢得很笨拙。\n\n踢到最后，大家都累得够呛。\n\n一个站在场边看了很久的男生走了过来。\n\n其他人见到他以后，态度明显比刚才认真了一些。\n\n岩子低声跟你说：\n\n“西哥，足球队队长。”\n\n西哥看了你一眼。\n\n“你以前踢过？”\n\n<<if $powerlevel >= 55>>\n\n[[说自己以前经常踢->EVT_013]]\n\n[[说只是平时随便踢踢->EVT_014]]\n\n<<else>>\n\n[[说自己水平一般，但挺喜欢踢->EVT_014]]\n\n<span class=\"disabled-option\">说自己以前经常踢</span>\n<span class=\"requirement\">[需要：武力值 ≥ 55]</span>\n\n<</if>>", "EVT_012": "“没事，我也不会踢，咱一起踢着玩呗！” 岩子拉着你就上了场。\n\n<<set $rel_yanzi = Math.min(100, $rel_yanzi + 1)>>\n\n<<set $met_yanzi_football = true>>\n\n天还没有完全黑，操场上的人却越来越多。\n\n瘦竹竿得身材让他的重心比其他人高，岩子踢得很笨拙。\n\n踢到最后，大家都累得够呛。\n\n一个站在场边看了很久的男生走了过来。\n\n其他人见到他以后，态度明显比刚才认真了一些。\n\n岩子低声跟你说：\n\n“西哥。”\n\n“足球队队长。”\n\n西哥看了你一眼。\n\n“你以前踢过？”\n\n<<if $powerlevel >= 55>>\n\n[[说自己以前经常踢->EVT_013]]\n\n[[说只是平时随便踢踢->EVT_014]]\n\n<<else>>\n\n[[说自己水平一般，但挺喜欢踢->EVT_014]]\n\n<span class=\"disabled-option\">说自己以前经常踢</span>\n<span class=\"requirement\">[需要：武力值 ≥ 55]</span>\n\n<</if>>", "EVT_013": "你刚才的表现没有多亮眼，但是是一个稳健的工兵，西哥很明显也注意到了。\n\n“我们队最近还缺人，你有兴趣试试吗？”\n\n[[欣然答应->EVT_015]]\n\n[[你想看看还有没有其他社团->EVT_016]]", "EVT_014": "你之前没怎么接触过足球，但是你挺喜欢操场上的激情和朋友并肩作战的感觉。\n\n“基础还行，平时再多练练，校队会有你的位置的。”西哥拍拍你的肩膀\n\n[[暗自下定决心，一定要进校队->EVT_017]]\n\n[[感觉目标太高，只想快乐运动->EVT_016]]", "EVT_015": "西哥把一件训练背心扔给你。\n\n“以后最后一节课下了就直接过来。”\n\n你接住背心。\n\n没有什么正式仪式。\n\n也没有欢迎会。\n\n但从这一刻开始，你已经算是足球队的人了。\n\n岩子站在旁边冲你笑。\n\n“以后一起练了。”\n\n<<set $joined_football = true>>\n<<set $powerlevel = Math.min(100, $powerlevel + 2)>>\n\n''已加入校足球队''\n\n[[吃晚饭，回去上晚自习->EVT_018]]", "EVT_016": "“谢谢西哥。”\n\n你最上应着，但是感受着自己几乎抽筋的双腿和剧烈的心脏撞击声，你感觉目标是那么遥不可及。\n\n以后再看看其他社团吧。你心里想。\n\n[[吃晚饭，回去上晚自习->EVT_018]]", "EVT_017": "你点了点头，你看着身边的岩子，眼神里是难以抑制的兴奋。\n\n以后可得加班加点地去练了。你心里想。\n\n[[吃晚饭，回去上晚自习->EVT_018]]", "EVT_018": "晚饭以后，你跟着人群回到教室。\n\n晚自习开始了。\n\n但这里和你想象中的“晚自习”有点不一样。\n\n没有老师站在讲台上盯着所有人。\n\n教室前面几排的人已经把课本和作业摊开，安安静静地开始写东西。\n\n中间有人戴着耳机，有人拿着手机小声聊天。\n\n后排更热闹。\n\n几个人凑在电脑前不知道在玩什么，还有人干脆趴在桌子上睡觉。\n\nClark偶尔会从门口经过，但似乎并不会一直待在教室里。\n\n你找了个位置坐下。\n\n今天白天发生的事情不少。\n\n现在终于有一段完全属于自己的时间。\n\n你准备——\n\n[[把今天的作业先处理掉->EVT_EVENING_02]]\n\n[[刷刷抖音->EVT_EVENING_03]]", "EVT_019": "一个月后。\n\n你终于发现，Biggie真正抽象的地方，不是在聊天。\n\n是在宿舍生活。\n\n首先是呼噜。\n\n“呼——噜噜噜噜——”\n\n然后是磨牙。\n\n嘎吱。\n\n嘎吱。\n\n还有他的脚。\n\n不是普通的脚臭。\n\n是一股很具体的熟香蕉味。\n\n还是那种已经熟透、皮都开始发黑的香蕉。\n\n最离谱的是，他特别喜欢睡前公放规则怪谈。\n\n而且声音很大。\n\n“凌晨三点以后，如果你听见走廊有人敲门……”\n\nBiggie已经睡着了。\n\n手机还在继续播。\n\n你躺在床上，闻着熟香蕉味，听着规则怪谈，再配上Biggie的呼噜。\n\n你突然觉得——\n\n真正的规则怪谈，可能就是这个寝室。\n\n<<set $biggie_dorm_problem = true>>\n\n[[算了，忍忍吧->EVT_020]]\n\n[[受不了了，想办法换寝->EVT_021]]", "EVT_020": "你决定再忍一忍。\n\n第二天醒来，你感觉自己像一晚上没睡。\n\n<<set $mentalhealth = Math.max(0, $mentalhealth - 2)>>\n\n心理健康 -2\n\n[[继续校园生活->EVT_024]]", "EVT_021": "第二天，你开始认真考虑换寝这件事。\n\n但寝室不是你想换就能换。\n\n你打听了一圈，最后发现有一个比较现实的办法。\n\n老五。\n\n如果他愿意和你换床位或者换寝，这件事就有可能办成。\n\n问题是——\n\n怎么让他愿意？\n\n[[先找老五聊聊，看能不能直接商量->EVT_021_A]]\n\n[[给老五一点好处，让他跟你换->EVT_021_B]]\n\n[[算了，再忍Biggie一阵子->EVT_021_C]]", "EVT_021_A": "你决定先不谈钱。\n\n“要不咱俩换个寝室？”\n\n老五看了你一眼。\n\n“为啥？”\n\n你想了想。\n\nBiggie的呼噜、香蕉味和规则怪谈同时出现在脑子里。\n\n“说来话长。”\n\n老五没有立刻答应。\n\n但也没有直接拒绝。\n\n<<set $negotiated_laowu = true>>\n\n[[继续和老五聊->EVT_022]]", "EVT_021_B": "你觉得光靠嘴可能有点困难。\n\n既然是让别人主动换寝，总得给点实际的。\n\n你找到老五。\n\n“要不咱俩换个寝室？”\n\n老五看着你。\n\n“我为啥要换？”\n\n你沉默了一下。\n\n看来得加点筹码。\n\n<<set $bribe_laowu = true>>\n\n[[跟老五谈条件->EVT_022]]", "EVT_021_C": "你想了半天，还是觉得换寝太麻烦。\n\n算了。\n\n再忍忍吧。\n\n晚上。\n\n“凌晨两点以后，如果你在宿舍闻到奇怪的气味……”\n\nBiggie的手机又响了起来。\n\n你闻了一下。\n\n熟香蕉。\n\n你开始后悔自己的决定。\n\n<<set $stayed_with_biggie = true>>\n\n[[继续->EVT_023]]", "EVT_022": "老五看着你。\n\n“所以，你想让我跟你换寝？”\n\n“嗯。”\n\n“那我为啥要换？”\n\n这个问题很现实。\n\n你决定拿出一点诚意。\n\n[[给老五捏脚按摩->EVT_022_A]]\n\n[[给老五买个游戏皮肤->EVT_022_B]]\n\n<<if $powerlevel >= 65>>\n[[跟老五讲讲什么叫强制换寝->EVT_022_C]]\n<<else>>\n<span class=\"disabled-option\">跟老五讲讲什么叫强制换寝</span>\n<span class=\"requirement\">[需要：武力值 ≥ 65]</span>\n<</if>>", "EVT_022_A": "你想了半天。\n\n钱能不花还是不花。\n\n“这样吧。”\n\n“我给你捏脚。”\n\n老五愣住了。\n\n“啥？”\n\n十分钟后。\n\n老五躺在床上。\n\n你坐在床尾给他按脚。\n\n宿舍陷入了一种诡异的安静。\n\n老五闭着眼睛。\n\n“左边。”\n\n你往左按。\n\n“上面点。”\n\n你往上按。\n\n“对对对，就那。”\n\n你突然开始怀疑——\n\n自己到底是来换寝的，还是来应聘技师的。\n\n过了一会儿，老五满意地点点头。\n\n“行。”\n\n“换。”\n\n你第一次意识到，有些事情真的可以靠手艺解决。\n\n<<set $negotiated_laowu = true>>\n\n[[终于可以搬寝了->EVT_023]]", "EVT_022_B": "你突然想到了一件事。\n\n老五最大的爱好不是学习。\n\n也不是社交。\n\n是打游戏。\n\n“你最近不是一直想要那个皮肤吗？”\n\n老五抬起头。\n\n“哪个？”\n\n“你天天念叨那个。”\n\n他的眼神瞬间变得认真。\n\n五分钟后。\n\n你们已经从换寝问题，进入了皮肤性价比讨论。\n\n最终，交易达成。\n\n你失去了一点钱。\n\nBiggie失去了一位室友。\n\n老五获得了全新的游戏体验。\n\n这是一次三方共赢。\n\n至少你是这么理解的。\n\n<<set $money = Math.max(0, $money - 100)>>\n<<set $bought_laowu_skin = true>>\n\n[[交易达成，开始搬寝->EVT_023]]", "EVT_022_C": "你看着老五。\n\n突然觉得事情没必要搞得那么复杂。\n\n“不换？”\n\n老五看了看你。\n\n“咋？”\n\n你活动了一下肩膀。\n\n“我再问一次。”\n\n“换不换？”\n\n宿舍安静了几秒。\n\n老五认真观察了一下你。\n\n又认真考虑了一下自己的生命安全。\n\n“换。”\n\n你点点头。\n\n谈判圆满结束。\n\n整个过程没有任何人受伤。\n\n这充分证明了和平交流的重要性。\n\n<<set $forced_laowu_change = true>>\n<<set $want_change_dorm = true>>\n\n[[开始搬寝->EVT_023]]", "EVT_023": "换寝的事情终于告一段落。\n\n新寝室里是勒夫、面达人和大熊。\n\n至少现在，你终于可以正常睡觉了。\n\n宿舍的问题解决以后，生活又重新回到了课堂、晚自习和课间。\n\n而你也开始慢慢接触到一些以前没碰过的东西。\n\n[[继续校园生活->EVT_024]]", "EVT_024": "课间，你去厕所。\n\n刚进去，就看见王小靠在窗边抽烟。\n\n他看到你，什么也没问。\n\n直接掏出两根烟，一起点着。\n\n然后把其中一根递到你面前。\n\n“来一根？”\n\n你看着那根已经点着的烟。\n\n[[直接去举报给老师->EVT_024_A]]\n\n[[接过来，随波逐流->EVT_024_B]]\n\n[[笑着说：你这烟我抽不惯->EVT_024_C]]", "EVT_024_A": "你没接。\n\n转身就把这事告诉了老师。\n\n王小后来知道以后，看你的眼神明显不太一样了。\n\n<<set $social = Math.max(0, $social - 2)>>\n<<set $reported_wangxiao = true>>\n\n社交 -2\n\n[[继续->EVT_025]]", "EVT_024_B": "你接过烟。\n\n学着他的样子吸了一口。\n\n下一秒。\n\n“咳！咳咳咳——”\n\n王小在旁边笑得不行。\n\n“你第一次啊？”\n\n你没说话。\n\n眼泪都快咳出来了。\n\n<<set $social = Math.min(100, $social + 2)>>\n<<set $mentalhealth = Math.max(0, $mentalhealth - 1)>>\n<<set $smoked_once = true>>\n\n社交 +2\n心理健康 -1\n\n[[继续->EVT_025]]", "EVT_024_C": "你看了看他手里的烟。\n\n摇摇头。\n\n“你这烟我抽不惯。”\n\n王小愣了一下。\n\n“那你抽啥？”\n\n你一本正经地说：\n\n“我得抽利群，劲大能压住心里的事。”\n\n王小盯着你看了两秒。\n\n“滚。”\n\n两个人都笑了。\n\n烟没抽。\n\n逼装到了。\n\n<<set $charming = Math.min(100, $charming + 2)>>\n<<set $social = Math.min(100, $social + 1)>>\n<<set $joked_about_cigar = true>>\n\n魅力 +2\n社交 +1\n\n[[继续->EVT_025]]", "EVT_025": "后来你才慢慢知道，王小和你以前认识的同学不太一样。\n\n他很早就开始自己处理很多事情。\n\n抽烟、喝酒、出去玩，对他来说似乎都不是什么新鲜事。\n\n他说话有时候很糙，但看很多事情却比同龄人现实。\n\n你开始发现——\n\n学校里教你的东西，不一定都在课本上。\n\n[[继续听王小讲他的事->EVT_025_A]]\n\n[[觉得这些离自己太远了->EVT_026]]", "EVT_025_A": "王小家里的事情，比你想象中复杂。\n\n父母很早就离了婚，以前在家也经常吵架。\n\n很多时候，根本没人管他。\n\n所以他很早就习惯了自己出去玩，自己解决问题。\n\n抽烟、喝酒、出去混，对他来说都不算什么新鲜事。\n\n他甚至跟你说过——\n\n他喜欢上过一个小姐。\n\n是出去嫖的时候认识的。\n\n你一开始以为他在吹牛。\n\n但他说这件事的时候，反而少见地没有开玩笑。\n\n王小平时最喜欢嘲笑别人。\n\n什么事都能损两句。\n\n像是什么都不在乎。\n\n但你慢慢发现，那可能也是他保护自己的方式。\n\n当然。\n\n这并不代表他干的所有事都值得理解。\n\n因为这人有时候是真的坏。\n\n有一次大半夜，他给宿管打电话。\n\n“老师，赶紧上来，有急事。”\n\n宿管急匆匆跑进寝室。\n\n王小躺在床上，指了指桌子。\n\n“帮我把充电器拿一下。”\n\n你看着离他不到两米的桌子。\n\n沉默了。\n\n<<set $wangxiao_background_known = true>>\n\n[[去课堂的第一次考试->EVT_026]]", "EVT_026": "入学后的第一次考试开始了。\n\n你的位置有点微妙。\n\n左边是阎王。他是学校的风云人物，今年已经高四了，极有可能在再战一年。\n\n右边是林曦。\n\n阎王人高马大，往那一坐，像《权力的游戏》里的魔山。\n\n考试做到一半，他开始频频往林曦那边看。\n\n然后低声问你：\n\n“她第三题选啥？”\n\n你看了一眼林曦，又看了一眼阎王。\n\n你决定——\n\n[[帮阎王传答案，自己也顺便抄两眼->EVT_026_A]]\n\n[[假装帮忙，故意告诉阎王错误答案->EVT_026_B]]\n\n[[直接告诉阎王：别抄了，这样不对->EVT_026_C]]", "EVT_026_A": "你看了一眼林曦的卷子。\n\n“A。”\n\n阎王点点头。\n\n你自己也顺便抄了几题。\n\n考试结束以后，他拍了拍你的肩膀。\n\n“以后跟我混。”\n\n你当时还觉得这句话挺爽。\n\n后来你才知道——\n\n阎王对自己人，是真的好。\n\n点外卖会叫上你，吃东西也从不跟你计较。\n\n但有些人情，吃着吃着，是要还的。\n\n<<set $rel_yanwang = Math.min(100, $rel_yanwang + 8)>>\n<<set $yanwang_circle = true>>\n<<set $helped_yanwang_cheat = true>>\n\n阎王关系 +8\n\n[[交卷->EVT_027]]", "EVT_026_B": "你装模作样地看了一眼林曦的卷子。\n\n“C。”\n\n其实答案是A。\n\n阎王毫不犹豫地写了上去。\n\n你低头憋着笑。\n\n现在他还不知道。\n\n但等成绩下来以后——\n\n这事恐怕没那么容易过去。\n\n<<set $rel_yanwang = Math.max(0, $rel_yanwang - 5)>>\n<<set $tricked_yanwang = true>>\n<<set $yanwang_grudge = true>>\n\n阎王关系 -5\n\n[[交卷->EVT_027]]", "EVT_026_C": "你低声说：\n\n“别抄了。”\n\n阎王皱了皱眉。\n\n“咋了？”\n\n“考试就自己写呗，别一直看她的。”\n\n他盯了你两秒。\n\n林曦没有说话。\n\n但你能感觉到，她往你这边看了一眼。\n\n<<set $rel_linxi = Math.min(100, $rel_linxi + 2)>>\n<<set $powerlevel = Math.min(100, $powerlevel + 1)>>\n<<set $protected_linxi_exam = true>>\n\n林曦好感 +2\n武力/威望 +1\n\n[[交卷->EVT_027]]", "EVT_027": "快到学期末了。\n\n<<if $joined_football>>\n\n这天下午，你照常来到足球场参加训练。\n\n西哥他们正在踢对抗。\n\n<<else>>\n\n这天下午放学以后，你从操场附近经过。\n\n远远就听见足球场那边有人在吵。\n\n你停下来，看了一眼。\n\n<</if>>\n\n阎王正站在球场里面。\n\n西哥冲他喊：\n\n“踢球呢，出去点。”\n\n阎王没动。\n\n“我就从这走，咋了？”\n\n西哥也火了。\n\n“让你出去听不懂？”\n\n两个人越说越冲。\n\n周围的人慢慢围了起来。\n\n眼看就要动手。\n\n[[赶紧去叫老师->EVT_FIGHT_REPORT]]\n\n[[站到阎王这边->EVT_FIGHT_YANWANG]]\n\n[[站到西哥和足球队这边->EVT_FIGHT_FOOTBALL]]", "EVT_028": "<<set $flag_linxi_saw_fight = true>>\n\n人群慢慢散开。\n\n你抬头的时候，看见林曦正站在跑道旁边。刚才操场上的动静，她显然注意到了。\n\n你们对视了一眼。这一次和停电那次不太一样。\n\n非常不一样。\n\n<<if $reported_first_fight>>\n\n    <<set $rel_linxi = Math.min(100, $rel_linxi + 5)>>\n\n    林曦走过来。\n\n    “你刚才去叫老师了？”\n\n    “嗯。”\n\n    她点了点头： “千万别打架。”\n\n    你本来想说这没什么。\n\n    但想了想，你什么也没说，也点了点头。\n\n    林曦关系 +5\n\n<<elseif $stopped_first_fight>>\n\n    <<set $rel_linxi = Math.min(100, $rel_linxi + 3)>>\n\n    林曦看了看已经散开的人群。\n\n    “你刚才一直在拉他们？”\n\n    “差不多。”\n\n    “我还以为你也要打。”\n\n    她说完笑了一下。\n\n    “看来还行。”\n\n    你不知道这个“还行”具体是指什么。\n\n    反正她笑了。\n\n    林曦关系 +3\n\n<<elseif $joined_first_fight>>\n\n    <<set $rel_linxi = Math.max(0, $rel_linxi - 5)>>\n\n    林曦看着你。\n\n    “你刚才也打了？”\n\n    “……”\n\n    这个问题其实不太适合使用语言技巧， 因为她全看见了。\n\n    “算……参与了一下。”\n\n    她皱了皱眉; “你们男的是不是都觉得打架特别帅？”\n\n    你很想解释,但现在解释容易显得更不帅。\n\n    林曦关系 -5\n\n<</if>>\n\n[[继续->EVT_FIGHT_AFTER]]", "EVT_029": "<h2>高一 · 学年结束</h2>\n\n期末考试结束。\n\n成绩单终于发了下来。\n\n这一年你到底把多少心思放在学习上，\n\n现在基本能看出来了。\n\n<<set $academic_y1 = $academic>>\n\n<<if $academic >= 75>>\n\n    <<set $grade_y1 = \"S\">>\n\n    ''高一学术评级：S''\n\n    成绩很好。\n\n    老师看你的成绩单时基本没什么话可说。\n\n    这通常是件好事。\n\n<<elseif $academic >= 65>>\n\n    <<set $grade_y1 = \"A\">>\n\n    ''高一学术评级：A''\n\n    成绩不错。\n\n    如果保持下去，以后申请学校的时候不会太难看。\n\n<<elseif $academic >= 55>>\n\n    <<set $grade_y1 = \"B\">>\n\n    ''高一学术评级：B''\n\n    中规中矩。\n\n    不算学霸,但暂时也没人需要为你的未来召开紧急会议。\n\n<<elseif $academic >= 45>>\n\n    <<set $grade_y1 = \"C\">>\n\n    ''高一学术评级：C''\n\n    成绩单还能看, 只是最好不要盯得太仔细。\n\n<<else>>\n\n    <<set $grade_y1 = \"D\">>\n\n    ''高一学术评级：D''\n\n    老师把成绩单递给你。\n\n    你看了一遍。\n\n    又看了一遍。\n\n    数字没有因为你的诚意发生任何变化。\n\n<</if>>\n\n[[结束高一->EVT_YEAR1_END]]", "EVT_040": "你往篮球场走了过去。\n\n和足球场比起来，这边明显更吵。\n\n几个半场都有人在打。\n\n球鞋摩擦地面的声音、篮球砸在地板上的声音，还有场边不断传来的起哄声混在一起。\n\n你站在旁边看了一会儿。\n\n这里的人似乎比足球场更多。\n\n你本来只是想活动一下身体。\n\n看了一会儿以后，正好有一边少个人。\n\n有人冲你喊：\n\n“哥们，来一个？”\n\n[[上去随便打一会儿->EVT_040_A]]\n\n[[今天就看看，不下场了->EVT_040_B]]", "EVT_040_A": "你把东西放到场边，加入了他们。\n\n没人问你叫什么。\n\n球一发出来，大家就开始跑。\n\n你很快发现这里的节奏并不慢。\n\n有人身体对抗很强。\n\n有人投篮很准。\n\n还有几个一看就是经常打球的。\n\n你跟着打了几轮。\n\n不管表现怎么样，至少出了一身汗。\n\n<<set $powerlevel = Math.min(100, $powerlevel + 1)>>\n<<set $basketball_known = true>>\n\n等你停下来的时候，天已经暗了不少。\n\n旁边有人开始讨论一会儿吃什么。\n\n你看了看时间。\n\n差不多该去吃晚饭了。\n\n[[去吃饭，然后回教室上晚自习->EVT_018]]", "EVT_040_B": "你把东西放到场边，加入了他们。\n\n没人问你叫什么。\n\n球一发出来，大家就开始跑。\n\n你很快发现这里的节奏并不慢。\n\n有人身体对抗很强。\n\n有人投篮很准。\n\n还有几个一看就是经常打球的。\n\n你跟着打了几轮。\n\n不管表现怎么样，至少出了一身汗。\n\n<<set $powerlevel = Math.min(100, $powerlevel + 1)>>\n<<set $basketball_known = true>>\n\n等你停下来的时候，天已经暗了不少。\n\n旁边有人开始讨论一会儿吃什么。\n\n你看了看时间。\n\n差不多该去吃晚饭了。\n\n[[去吃饭，然后回教室上晚自习->EVT_018]]", "EVT_041": "你没有去找人一起玩。\n\n而是沿着操场慢慢跑了起来。\n\n下午的太阳已经没有那么晒。\n\n操场旁边不断有人经过。\n\n有人踢球。\n\n有人打篮球。\n\n还有几个人和你一样，戴着耳机一圈一圈地跑。\n\n刚开始的时候，你还有心情看看周围。\n\n跑到后面，你的注意力就只剩下自己的呼吸声。\n\n今天从早上开始一直在上课。\n\n脑子里塞满了英语、作业、老师和各种新面孔。\n\n跑了几圈以后，反而清醒了一点。\n\n<<set $powerlevel = Math.min(100, $powerlevel + 1)>>\n<<set $mentalhealth = Math.min(100, $mentalhealth + 1)>>\n<<set $first_run = true>>\n\n你停下来走了一会儿。\n\n天已经开始暗了。\n\n肚子也有点饿。\n\n[[去吃晚饭，然后回教室上晚自习->EVT_018]]", "EVT_DORM_END": "你看了眼时间，已经不早了。\n\n宿舍里的人也陆陆续续开始洗漱。\n\n有人拿着脸盆去水房，有人在床边刷牙，还有人躺着不动，嘴上说着“马上去”，实际上手机还没放下。\n\n你也收拾好东西，简单洗漱了一下。22：00，宿舍的灯准时全关。\n\n黑暗里还是有人在说话。\n\n声音越来越小。\n\n今天发生的事情开始一点一点从脑子里冒出来。\n\n<<if $joined_football>>\n下午足球场上的画面最先浮现出来。\n\n燕子、西哥，还有那件被扔到你手里的训练背心。\n\n你突然意识到，自己好像已经莫名其妙地加入了一个新的圈子。\n<</if>>\n\n<<if $noticed_linxi>>\n然后你又想起了林曦。\n\n晚自习时她转过身来，把作业推到你面前。\n\n还有宿舍里刚才那群人聊到她时起哄的样子。\n\n你翻了个身。\n\n不知道为什么，那个画面还挺清楚。\n<</if>>\n\n<<if $dorm_info_network>>\n今晚和室友聊了不少。\n\n你开始觉得，这所学校真正有意思的东西，可能并不全在课表和校规里。\n<</if>>\n\n<<if not $joined_football and not $noticed_linxi and not $dorm_info_network>>\n今天的信息实在太多了。\n\n老师、同学、走班、食堂、晚自习、宿舍。\n\n你一时甚至有点分不清哪些事情发生在上午，哪些事情发生在下午。\n<</if>>\n\n宿舍终于安静下来，你盯着黑暗里的天花板看了一会儿。\n\n明天还要继续上课。\n\n而你来到这里的生活，才刚刚开始。\n\n<<set $first_dorm_night_done = true>>\n\n[[睡觉->Action Sheet]]", "EVT_DORM_TALK_01": "你提到了下午在足球场碰到岩子。\n\n“岩子？”\n\n室友抬头看了你一眼。\n\n“他初中的时候就天天踢，和校队那些人特别熟。”\n\n<<set $rel_yanzi = Math.min(100, $rel_yanzi + 1)>>\n\n几个人越聊越随意，从班花扯到诸葛亮，从未来职业谈到宇宙大爆炸。\n\n你开始第一次感觉到：\n\n在学校里认识一个人，往往不只是认识他本人。\n\n还会慢慢认识他周围的一整个圈子。\n\n<<set $social = Math.min(100, $social + 1)>>\n<<set $dorm_info_network = true>>\n\n[[差不多了，准备洗漱睡觉->EVT_DORM_END]]", "EVT_DORM_TALK_02": "不知道谁把话题聊到了学校的规矩。\n\n“你们觉得晚自习真有人管吗？”\n\n有人笑了一声。\n\n“第一天你当然觉得有人管，过几天你就知道了。”\n\n另一个人接话：\n\n“宿舍也一样，游龙。”\n\n你听出这句话好像不只是随便说说。\n\n<<if $rules_skeptical>>\n\n你白天本来就觉得有些规定未必像表面上那么严格。\n\n现在听他们这么说，更觉得这里面应该有不少门道。\n\n<<set $rules_skeptical = true>>\n\n<</if>>\n\n你没有继续追问。\n\n但这句话还是记住了。\n\n<<set $heard_rule_loopholes = true>>\n\n[[问一句“什么意思？”->EVT_DORM_TALK_04]]\n\n[[不追问，把这件事记下来->EVT_DORM_END]]", "EVT_DORM_TALK_03": "你顺口提起了今天晚自习和你聊作业的林曦。\n\n话刚说出口，白天那个场景又自己钻进了脑子里。\n\n她坐在你前面，转过身和你说话的时候，马尾辫就在眼前轻轻晃着。靠得近了，还能闻到她校服上淡淡的洗衣粉味。很干净，不刺鼻。\n\n你当时其实没怎么注意。\n\n现在躺在宿舍里回想起来，反而记得格外清楚。\n\n“林曦啊？”\n\n室友一下来了精神。\n\n“她是挺漂亮的。”\n\n另一个人接话：\n\n“她闺蜜杜玉才漂亮呢，纯欲风，懂吗？”\n\n“杜玉是谁？”\n\n“以后你就知道了。”\n\n几个人笑了起来，你也跟着笑了两声。\n\n可话题已经换了好几轮，你脑子里的画面却还停在晚自习。\n\n像一小段没关掉的电影。\n\n林曦把作业推到你面前，她低头说着什么。那根马尾辫就在你眼前轻轻晃。\n\n<<if $rel_linxi >= 63>>\n你忽然有点期待明天再见到她。\n\n<<set $noticed_linxi = true>>\n<</if>>\n\n宿舍里的话题却早就已经跑远了。\n\n从班里哪个女生好看，扯到哪个老师最奇怪；从以后想去哪个国家读大学，又莫名其妙聊到了诸葛亮；最后甚至不知道是谁开始讨论宇宙到底有没有尽头。\n\n男生宿舍的夜聊大概就是这样。\n\n没有主题。\n\n但总能一直聊下去。\n\n[[差不多了，准备洗漱睡觉->EVT_DORM_END]]", "EVT_DORM_TALK_04": "“什么意思？”\n\n你忍不住问了一句。\n\n几个人互相看了一眼。\n\n其中一个人笑了。\n\n“哪天带你翻墙去。”\n\n另一个人补了一句：\n\n“这里没你想得那么严。”\n\n说完，他们明显没有继续往下讲的意思。\n\n你也没有再问。\n\n几个人越聊越随意，从班花扯到诸葛亮，从未来职业谈到宇宙大爆炸。\n<<set $heard_rule_loopholes = true>>\n<<set $dorm_info_network = true>>\n\n[[不再追问，准备睡觉->EVT_DORM_END]]", "EVT_EVENING_02": "你把书包拉到脚边，把今天的东西一样一样拿了出来。\n\n<<set $academic = Math.min(100, $academic + 1)>>\n\n你先翻开了 Graves 今天留下的作业。\n\n<<if $graves_effort>>\n\n白天上课的时候你一直在努力跟他的节奏。\n\n现在重新看材料，虽然还是很难，但很多内容至少还有印象。\n\n<<elseif $graves_asked_question>>\n\n白天你主动问过 Graves 一个问题。\n\n现在重新做到相关内容时，他当时的解释反而帮了你不少。\n\n<<elseif $class_observer>>\n\n白天你主要在观察班里的其他人。\n\n现在真正开始写作业以后，你才发现——\n\n知道谁是学霸是一回事。\n\n自己会不会写，是另一回事。\n\n<<else>>\n\n你盯着材料看了一会儿。\n\n这东西比上课的时候看起来还难。\n\n<</if>>\n\n你正低头写着。\n\n忽然，你听见前方传来一个很轻的声音：\n\n“同学。”\n\n你抬起头。\n\n坐在前面的女生回过头来。\n\n“今天 Graves 的课后作业，你写完了吗？”\n\n[[看看她到底是谁->EVT_EVENING_04]]", "EVT_EVENING_03": "你把手机藏在桌子下面，随手刷起了短视频。\n\n刚开始只想看几分钟。\n\n结果一条接着一条。\n\n教室里有人在写作业，有人在聊天。\n\nClark刚刚从门口经过一次，也没进来。\n\n你渐渐放松下来。\n\n<<set $mentalhealth = Math.min(100, $mentalhealth + 1)>>\n<<set $evening_slack = true>>\n\n就在你准备继续往下刷的时候——\n\n坐在前面的女生突然转过身。\n\n“同学。”\n\n你下意识把手机往桌子下面压了压。\n\n她似乎根本没在意。\n\n“今天 Graves 的作业，你写完了吗？”\n\n[[看看她到底是谁->EVT_EVENING_04]]", "EVT_EVENING_04": "你抬起头。\n\n坐在你前面一排的女生转过身来。\n\n你白天对她有一点印象，Graves上课提问的时候，她回答过一次。\n\n英语说得挺流畅，回答也很完整。\n\n她手里拿着今天发下来的材料，上面已经写了不少笔记。\n\n“你做到最后那个 analysis 了吗？”她压低声音问你。\n\n你愣了一下，“怎么了？”\n\n“我写完了，” 她把自己的纸往你这边递了一点，“但是我感觉最后一段有两种理解，想看看你怎么写的。”\n\n这倒让你有点意外。\n\n你原本以为她是来问答案的。\n\n<<set $met_linxi = true>>\n\n<<if $academic >= 53>>\n[[把自己的理解告诉她->EVT_LINXI_01]]\n<<else>>\n<span class=\"disabled-option\">跟她认真讨论自己的理解</span>\n<span class=\"requirement\">[需要：学术能力 ≥ 53]</span>\n<</if>>\n\n[[直接看看她是怎么写的->EVT_LINXI_02]]\n\n[[承认自己还没做到那里->EVT_LINXI_03]]", "EVT_EVENING_END": "晚自习结束以后，你跟着人群往宿舍走。\n\n楼道里比白天热闹得多。\n\n有人端着脸盆去洗漱，有人在门口串寝，还有人站在走廊里打电话。\n\n你推开宿舍门，几个人已经回来了。\n\n校服外套被随手扔在椅背上，鞋也踢得到处都是。\n\n白天在教室里还多少有点拘束，回到宿舍以后，大家明显放松了很多。\n\n有人躺在床上刷手机。\n\n有人坐在桌前拆零食。\n\n不知道是谁先开了个头，几个人慢慢聊起了今天发生的事。\n\n<<if $dorm_social_start>>\n\n你已经和他们熟了一些。\n\n所以很自然地也加入了话题。\n\n<<if $met_yanzi_football>>\n[[聊聊岩子->EVT_DORM_TALK_01]]\n<<else>>\n<span class=\"disabled-option\">聊聊岩子</span>\n<span class=\"requirement\">[需要：下午在足球场认识岩子]</span>\n<</if>>\n\n[[问问他们觉得学校这些规矩怎么样->EVT_DORM_TALK_02]]\n\n<<if $met_linxi>>\n[[聊聊林曦->EVT_DORM_TALK_03]]\n<<else>>\n<span class=\"disabled-option\">聊聊林曦</span>\n<span class=\"requirement\">[需要：已经认识林曦]</span>\n<</if>>\n\n<<else>>\n\n你和室友还没有那么熟。\n\n大部分时候，你只是在旁边听他们聊天。\n\n<span class=\"disabled-option\">主动聊聊岩子</span>\n<span class=\"requirement\">[需要：之前主动融入宿舍]</span>\n\n<span class=\"disabled-option\">问他们学校里的规矩</span>\n<span class=\"requirement\">[需要：之前主动融入宿舍]</span>\n\n<span class=\"disabled-option\">聊聊林曦</span>\n<span class=\"requirement\">[需要：之前主动融入宿舍]</span>\n\n[[坐在旁边听他们聊一会儿->EVT_DORM_END]]\n\n<</if>>", "EVT_FIGHT_AFTER": "最后，事情还是被学校压了下来。\n\n参与的人被叫去谈话。\n\n没真正动手的也免不了被问。\n\n<<if $reported_first_fight>>\n\n你因为提前叫了老师，基本没被卷进去。\n\n不过接下来几天，\n\n总有人看见你以后来一句：\n\n“老师来了。”\n\n也不知道是不是在叫你。\n\n<<set $flag_safe_choice = true>>\n\n<</if>>\n\n<<if $joined_first_fight>>\n\n你也被叫去问了话。\n\n老师问：\n\n“你为什么动手？”\n\n你想了半天。\n\n发现这个问题确实很难回答。\n\n总不能说：“当时气氛到这儿了。”\n\n\n<</if>>\n\n<<if $sided_with_football>>\n\n这件事之后，你和西哥、燕子明显熟了一些。\n\n有些关系就是这样。\n\n一起吃过饭是一回事。\n\n一起站过队，又是另一回事。\n\n<<set $flag_xige_circle = true>>\n\n<</if>>\n\n<<if $sided_with_yanwang>>\n\n阎王后来也没专门提这件事。\n\n但再见到你的时候，\n\n态度明显和以前不一样了。\n\n至少现在，\n\n你算是他那边的人。\n\n<<set $yanwang_circle = true>>\n\n<</if>>\n\n事情过去以后，\n\n学校还是那个学校，照常上课，照常晚自习。\n\n操场上第二天又有人开始踢球，好像昨天什么都没发生。\n\n但你知道，有些东西已经不一样了。\n\n你开始慢慢发现——\n\n在梧桐，你认识谁，跟谁玩，关键时候站在哪边，真的会改变之后发生的事。\n\n<<set $first_major_conflict_done = true>>\n\n[[继续->EVT_029]]", "EVT_FIGHT_BREAKOUT": "两边还在互相骂。\n\n不知道是谁先推了一下。\n\n反正下一秒——\n\n真打起来了。\n\n事情发生得比你想象中快得多。\n\n刚才还只是几个人站着吵架。\n\n十秒以后，足球已经滚到了场外。\n\n有人在拉架。\n\n有人在喊。\n\n还有人在非常专业地往后退。\n\n生怕拉架的时候被算进参战名单。\n\n<<if $sided_with_football>>\n\n阎王直接朝西哥冲了过去。\n\n西哥也没惯着他。\n\n燕子刚往前一步，旁边又有人挤了进来。\n\n你站得太近。\n\n现在想退出去已经有点晚了。\n\n[[上去帮西哥拉住阎王->EVT_FIGHT_JOIN_FOOTBALL]]\n\n[[别扩大事情，拦住自己这边的人->EVT_FIGHT_STOP_FOOTBALL]]\n\n<<elseif $sided_with_yanwang>>\n\n阎王冲上去以后，你几乎是跟着一起被卷进去的。\n\n西哥那边人不少。\n\n燕子也已经过来了。\n\n你突然意识到一个问题。\n\n刚才站队的时候挺快。\n\n现在要挨打了。\n\n[[跟阎王一起顶上去->EVT_FIGHT_JOIN_YANWANG]]\n\n[[抓住阎王，别让他继续冲->EVT_FIGHT_STOP_YANWANG]]\n\n<</if>>", "EVT_FIGHT_FOOTBALL": "你走到西哥旁边。\n\n燕子他们也围了上来。\n\n<<if $joined_football>>\n\n你本来就是球队的一员。\n\n这个时候站在哪边，好像根本不用想。\n\n<</if>>\n\n<<set $rel_yanwang = Math.max(0, $rel_yanwang - 10)>>\n<<set $sided_with_football = true>>\n\n阎王关系 -10\n\n[[继续->EVT_FIGHT_BREAKOUT]]", "EVT_FIGHT_JOIN_FOOTBALL": "<<set $powerlevel = Math.min(100, $powerlevel + 8)>>\n<<set $social = Math.min(100, $social + 2)>>\n<<set $joined_first_fight = true>>\n\n你冲上去帮忙。\n\n本来想的是把阎王拉开。\n\n实际效果大概是——\n\n所有人抱成了一团。\n\n你甚至有一瞬间不知道自己抓的是谁。\n\n直到有人在你耳边喊：\n\n“你他妈踩我鞋了！”\n\n你低头。\n\n确实踩了。\n\n但现在显然不是道歉的时候。\n\n武力/威望 +8\n社交 +2  \n\n[[继续->EVT_FIGHT_TEACHER]]", "EVT_FIGHT_JOIN_YANWANG": "<<set $powerlevel = Math.min(100, $powerlevel + 8)>>\n<<set $rel_yanwang = Math.min(100, $rel_yanwang + 5)>>\n<<set $joined_first_fight = true>>\n\n你跟着阎王冲了上去。\n\n真正挤进去以后，你才发现打群架和电影里完全不是一回事。\n\n没有慢动作。\n\n没有背景音乐。\n\n甚至没有人知道谁在打谁。\n\n你刚准备往前，\n\n不知道谁的胳膊从旁边飞过来。\n\n你赶紧一缩脖子。\n\n这一刻你对自己的反应速度产生了一点新的认识。\n\n武力/威望 +8  \n阎王关系 +5\n\n[[继续->EVT_FIGHT_TEACHER]]", "EVT_FIGHT_REPORT": "你没继续看热闹。\n\n转身就往教学楼跑。\n\n再回来时，老师已经跟着你冲到了操场。\n\n两边最终还是被拉开了。\n\n<<set $reported_first_fight = true>>\n<<set $social = Math.max(0, $social - 2)>>\n\n社交 -2\n\n[[继续->EVT_028]]", "EVT_FIGHT_STOP_FOOTBALL": "<<set $social = Math.min(100, $social + 2)>>\n<<set $stopped_first_fight = true>>\n\n你一把抱住旁边还想往前冲的人。\n\n“别上了！”\n\n“松开！”\n\n“你上去能干啥？”\n\n对方愣了一下。\n\n这个问题似乎把他问住了。\n\n场面已经够乱了。\n\n至少你没让自己这边再多进去一个。\n\n社交 +2\n\n[[继续->EVT_FIGHT_TEACHER]]", "EVT_FIGHT_STOP_YANWANG": "<<set $rel_yanwang = Math.min(100, $rel_yanwang + 2)>>\n<<set $stopped_first_fight = true>>\n\n你从后面一把抓住阎王。\n\n“差不多得了。”\n\n“松开！”\n\n“老师真来了你们都得死。”\n\n阎王还在往前挣。\n\n你死死拽着他。\n\n有那么一瞬间，\n\n你感觉自己在拉一辆火车。\n\n阎王关系 +2\n\n[[继续->EVT_FIGHT_TEACHER]]", "EVT_FIGHT_TEACHER": "远处突然传来一声：\n\n“干什么呢！！”\n\n效果非常明显，刚才还挤成一团的人群瞬间散开。\n\n老师一路跑过来。\n\n西哥站在一边，喘着气。阎王也没再往前。\n\n地上躺着一个孤零零的足球。它可能是整件事里唯一完全无辜的东西。\n\n“谁先动的手？”\n\n没人说话。\n\n老师看了一圈。\n\n“都觉得自己挺牛是吧？”\n\n老师还在大声训斥着你们，你忽然看见林曦就在跑道上散步，你能感受到她的目光全部聚焦在你身上。\n\n[[继续->EVT_028]]", "EVT_FIGHT_YANWANG": "你走到了阎王旁边。\n\n阎王看了你一眼。\n\n<<if $yanwang_circle>>\n\n他什么都没说。\n\n只是往旁边给你让了半步。\n\n那一刻你突然明白——\n\n之前那些外卖，好像不是白吃的。\n\n<</if>>\n\n<<set $rel_yanwang = Math.min(100, $rel_yanwang + 8)>>\n<<set $sided_with_yanwang = true>>\n\n阎王关系 +8\n\n[[继续->EVT_FIGHT_BREAKOUT]]", "EVT_LINXI_01": "你把自己的材料往前推了一点。\n\n“我觉得这里不只是分析作者想表达什么。”\n\n“前面那个例子可能也要一起联系。”\n\n林曦低头看了一会儿。\n\n“对。”\n\n她拿笔在自己的纸上划了一下。\n\n“我刚才就在纠结这个。”\n\n你们两个压着声音讨论了几分钟。\n\n说着说着，你发现她对这篇文章其实理解得比你深不少。\n\n有两个你没有注意到的地方，反而是她提醒了你。\n\n<<set $academic = Math.min(100, $academic + 1)>>\n<<set $rel_linxi = Math.min(100, $rel_linxi + 3)>>\n<<set $linxi_first_study = true>>\n\n讨论完以后，她把纸拿了回去。\n\n“谢谢。”\n\n停了一下，她又补了一句：\n\n“你叫什么来着？”\n\n你告诉了她。\n\n“林曦。”\n\n她也重新说了一遍自己的名字。\n\n虽然白天已经听过一次。\n\n但这一次，你真正记住了。\n\n[[继续晚自习->EVT_EVENING_END]]", "EVT_LINXI_02": "你把她的材料接了过来。\n\n她已经写了不少。\n\n字很整齐。\n\n旁边还记着几行英文笔记。\n\n你看了一会儿，很快发现她不是来找你要答案的。\n\n反而是她的进度比你快不少。\n\n“你这不是都写完了吗？”\n\n你问。\n\n林曦笑了一下。\n\n“写完不代表写对了啊。”\n\n她指了指最后一段。\n\n“我就是觉得这里有点奇怪。”\n\n你们简单聊了两句。\n\n虽然主要是她在解释自己的思路，但你多少也弄明白了一些。\n\n<<set $academic = Math.min(100, $academic + 1)>>\n<<set $rel_linxi = Math.min(100, $rel_linxi + 1)>>\n<<set $linxi_helped_player = true>>\n\n“懂了吗？”林曦问道。\n\n“差不多，谢谢林老师。” 她刚刚介绍自己叫林曦。\n\n“那行。” 她转回去继续写自己的东西。\n\n你这才第一次记住她的名字。\n\n[[继续晚自习->EVT_EVENING_END]]", "EVT_LINXI_03": "你看了一眼自己的进度。\n\n“我还没做到那。”\n\n林曦也低头看了一眼。\n\n“这么慢？”\n\n语气里倒没有嘲笑的意思。\n\n更像是单纯有点意外。\n\n“Graves这作业也太多了。”\n\n你说。\n\n她笑了一下。\n\n“确实。”\n\n她把自己的材料往你这边放了一点。\n\n“那你做到的时候可以看看我的。”\n\n“但是别直接抄啊。”\n\n<<set $rel_linxi = Math.min(100, $rel_linxi + 1)>>\n<<set $linxi_helped_player = true>>\n\n你点了点头。\n\n她转回去以后，你又看了一眼她的背影。\n\n她介绍自己叫林曦，你记住这个名字了。\n\n[[继续晚自习->EVT_EVENING_END]]", "EVT_MONTH1_START": "你已经基本适应了梧桐的生活。\n\n走班不会再迷路，食堂也知道哪个窗口排得最快，晚自习什么时候最容易犯困你都摸清了。\n\n最开始那些新鲜感，慢慢变成了日常。\n\n但住得久了以后，有些问题也开始暴露出来。\n\n尤其是你的室友——Biggie。\n\n你和Biggie住进了同一个寝室。\n\n刚认识的时候，你觉得他还挺有意思。\n\n人很胖，喜欢说唱，也特别研究衣服鞋子。\n\n说话有时候挺抽象，家里条件也不错。\n\n至少一开始，你觉得这个室友还挺好玩的。\n\n\n[[这天晚上，你终于有点受不了了->EVT_019]]", "EVT_SUMMER_01": "<<set $summer_actions = 3>>\n\n<h2>暑假</h2>\n\n高一终于结束了。没有早八，没有晚自习，没有领事，没有宿舍熄灯。\n\n你突然拥有了大量自由时间。\n\n这个暑假，你有 ''3 次行动机会''。\n\n[[开始安排暑假->SUMMER_ACTION_SELECT]]", "EVT_YEAR1_END": "<h2>高一 · 结束</h2>\n\n这一年结束了。\n\n你已经不再是刚进枫叶时那个什么都不知道的新生。\n\n你有了自己的朋友。\n\n自己的关系。\n\n自己的麻烦。\n\n还有一些只有你自己知道的事情。\n\n\n<strong>高一学术评级：</strong> $grade_y1\n\n<<if $rel_linxi >= 80>>\n<strong>林曦：</strong> 你们之间好像已经不只是普通同学了。\n<<elseif $rel_linxi >= 70>>\n<strong>林曦：</strong> 你们渐渐熟悉了起来。\n<<else>>\n<strong>林曦：</strong> 你们依然只是普通同学。\n<</if>>\n\n<<if $flag_climbed_wall>>\n<strong>校园生活：</strong> 你已经掌握了一些校规上不会教你的知识。\n<</if>>\n\n<<if $joined_first_fight>>\n<strong>第一次冲突：</strong> 你真的动了手。\n<<elseif $stopped_first_fight>>\n<strong>第一次冲突：</strong> 你最后选择了拉架。\n<<elseif $reported_first_fight>>\n<strong>第一次冲突：</strong> 你选择叫来了老师。\n<</if>>\n\n但这些事情现在都已经过去了。\n\n暑假来了。\n\n而高二，\n\n显然不会比高一更安静。\n\n[[进入暑假->EVT_SUMMER_01]]", "EVT_YEAR2_START": "", "SUMMER_ACTION_SELECT": "<h2>这个暑假，你准备干点什么？</h2>\n\n剩余行动次数：''$summer_actions''\n\n<<if $summer_actions > 0>>\n\n    [[继续学习->SUMMER_STUDY]]\n\n    [[锻炼身体->SUMMER_TRAIN]]\n\n    [[在家打游戏->SUMMER_GAME]]\n\n    <<if $rel_linxi >= 65 and $summer_linxi_done is false>>\n        [[找林曦出去->SUMMER_LINXI]]\n    <</if>>\n\n \n        [[问问勒夫暑假有什么节目->SUMMER_LOVE]]\n   \n\n<<else>>\n\n    这个暑假的安排已经差不多了。\n\n    [[结束暑假->SUMMER_END]]\n\n<</if>>", "SUMMER_END": "<h2>暑假结束</h2>\n\n一个暑假就这么过去了。\n\n回头看，好像很长，又好像什么都没干。\n\n<<if $summer_actions <= 0>>\n\n三个属于你的选择已经结束。\n\n<</if>>\n\n<<if $flag_linxi_first_date is true>>\n这个夏天，\n\n你和林曦之间，好像又多了一点什么。\n<</if>>\n\n暑假最后几天，你开始重新整理行李。\n\n高二到了。\n\n但这一次，\n\n你已经不是那个刚进枫叶，\n\n连食堂在哪都不知道的新生了。\n\n[[进入高二->EVT_YEAR2_START]]", "SUMMER_GAME": "<<set $mentalhealth = Math.min(100, $mentalhealth + 5)>>\n<<set $academic = Math.max(0, $academic - 2)>>\n<<set $summer_actions -= 1>>\n\n你决定好好享受暑假。\n\n电脑打开；空调打开；饮料放在旁边。\n\n一切准备就绪。\n\n凌晨两点。\n\n“最后一把。”\n\n凌晨四点。\n\n“赢了就睡。”\n\n早上七点。\n\n你赢了。\n\n窗外也亮了。\n\n心理 +5  \n学术 -2\n\n[[继续暑假->SUMMER_ACTION_SELECT]]", "SUMMER_LINXI": "<<set $summer_actions -= 1>>\n<<set $summer_linxi_done = true>>\n\n你在微信上盯着林曦的头像看了一会儿。\n\n打了一行字。\n\n删掉。\n\n又打了一行。\n\n又删掉。\n\n最后你发：“在吗？”\n\n这是你用了120%勇气打出的的两个字。\n\n过了一会儿。\n\n她回了：“在啊。”\n\n你突然发现，\n\n真正困难的部分现在才开始。\n\n[[约她出去吃东西->SUMMER_LINXI_DATE]]\n\n[[找个理由问她作业->SUMMER_LINXI_HOMEWORK]]", "SUMMER_LINXI_DATE": "<<set $rel_linxi = Math.min(100, $rel_linxi + 8)>>\n<<set $flag_linxi_first_date = true>>\n\n你最后还是问了：\n\n“这几天有空吗？出去吃个东西？”\n\n消息发出去以后，你把手机放下，心脏开始扑通扑通乱跳。\n\n十秒钟后又拿起来，没有回复。\n\n你又放下，三秒后重新拿起来。\n\n还是没有。\n\n你第一次觉得微信的“正在输入”功能是一种精神刑具。\n\n过了一会儿。\n\n她回：\n\n“可以啊。”\n\n……\n\n你盯着那三个字，脑海中有一万朵花同时开放；有一万个烟花在夜空中绽放；有一万只蝴蝶在你身边飞舞...\n\n林曦关系 +8\n\n[[继续暑假->SUMMER_ACTION_SELECT]]", "SUMMER_LINXI_HOMEWORK": "<<set $rel_linxi = Math.min(100, $rel_linxi + 3)>>\n\n你最后发出去的是：\n\n“那个暑假作业你写了吗？”\n\n明明那么想见她，怎么还偏发个这种消息，真他妈窝囊！你骂自己。\n\n林曦很快回复：“写了一点。”\n\n然后又发了一句：\n\n“你找我就为了问作业？”\n\n你看着屏幕。\n\n……\n\n事情好像突然出现了一点转机。\n\n林曦关系 +3\n\n[[继续暑假->SUMMER_ACTION_SELECT]]", "SUMMER_LOVE": "你给 Love 发了条消息。\n\n“暑假干嘛呢？”\n\n他几乎秒回。\n\n“想去北京玩，岩子也想去，走不？”\n\n<<if $money >= 1000>>\n\n    [[必须去啊->SUMMER_LOVE_BEIJING]]\n\n<<else>>\n\n    [[囊中羞涩，下次再说->SUMMER_LOVE_NO_MONEY]]\n\n<</if>>", "SUMMER_LOVE_BEIJING": "<<set $summer_actions -= 1>>\n<<set $summer_love_done = true>>\n\n<<set $money = Math.max(0, $money - 1000)>>\n<<set $social = Math.min(100, $social + 5)>>\n<<set $mentalhealth = Math.min(100, $mentalhealth + 5)>>\n\n“必须去啊。”\n\n你几乎没怎么犹豫。\n\nLove回了一个：“稳。”\n\n没过多久，岩子也进了群。\n\n于是这个暑假，你和Love、岩子真的跑了一趟北京。\n\n你们三个没什么钱，只能省着花。去你们去东单打球，去后海在就把外面听民谣，去三里屯看美女，去网吧打游戏...\n\n等你回家的时候，人很累。钱包也明显薄了一层。\n\n但心情确实不错。\n\n金钱 -1000  \n社交 +5  \n心理健康 +5\n\n<<set $flag_love_beijing = true>>\n\n[[继续暑假->SUMMER_ACTION_SELECT]]", "SUMMER_LOVE_NO_MONEY": "<<set $summer_love_done = true>>\n<<set $flag_love_beijing_missed = true>>\n\n你打开自己的钱包，又看了一眼余额。\n\n沉默了几秒。\n\n“下次吧。”\n\nLove回：\n\n“没钱？”\n\n你：\n\n“主要是最近比较喜欢海南。”\n\n“懂了。”\n\n[[换个安排->SUMMER_ACTION_SELECT]]", "SUMMER_STUDY": "<<set $academic = Math.min(100, $academic + 6)>>\n<<set $summer_actions -= 1>>\n\n你决定趁暑假学点东西。\n\n计划制定得非常完整。早上背单词; 下午练口语；晚上刷题。\n\n第一天执行得很好，第二天也还行。\n\n第三天，你开始研究：\n\n“每天学习八小时是否违反人类生理规律。”\n\n不过多少还是学进去了点东西。\n\n学术 +6\n\n[[继续暑假->SUMMER_ACTION_SELECT]]", "SUMMER_TRAIN": "<<set $powerlevel = Math.min(100, $powerlevel + 6)>>\n<<set $summer_actions -= 1>>\n\n你决定练练身体。\n\n一开始非常痛苦，尤其是第二天起床的时候。\n\n你把自己想象成是一个杀手，在为复仇做准备。这么坚持一阵以后，确实能感觉到身体状态好了不少。\n\n武力 +6\n\n[[继续暑假->SUMMER_ACTION_SELECT]]"};
const STORY_INIT = "/* 核心人物关系：0 ~ 100 */\n<<set $rel_zhang = 60>>\n<<set $rel_clark = 60>>\n<<set $rel_graves = 60>>\n<<set $rel_yanzi = 60>>\n<<set $rel_linxi = 60>>\n<<set $rel_yanwang = 50>>\n\n/* 玩家核心属性 */\n<<set $academic = 50>>   /* 学术/英语综合能力：0 ~ 100 */\n<<set $social = 50>>     /* 社交能力：0 ~ 100 */\n<<set $powerlevel = 50>> /* 武力值(威望）：0 ~ 100，高=打架更强 */\n<<set $charming = 50>>    /* 魅力：0 ~ 100 */\n<<set $mentalhealth = 50>>    /* 心理健康：0 ~ 100 */\n\n/* 资源 */\n<<set $money = 1000>>    /* 当前可支配金额/饭卡资源，后续可再拆 */\n\n/* ===== 行动系统 ===== */\n\n<<set $year = 1>>\n<<set $semester = 1>>\n\n/* 当前学期是否已经行动 */\n<<set $action_done = false>>\n\n/* 总共已经使用多少次行动 */\n<<set $action_count = 0>>\n\n/* 林曦关系 */\n<<set $flag_linxi_saw_fight = false>>\n\n/* 林曦关系阶段 */\n<<set $linxi_stage = 0>>\n \n/* 剧情 Flag */\n<<set $oriented = false>>\n<<set $social_start = false>>\n<<set $dorm_social_start = false>>\n<<set $cafeteria_known = false>>\n<<set $leave_rules_known = false>>\n<<set $rules_skeptical = false>>\n<<set $clark_direct = false>>\n<<set $graves_effort = false>>\n<<set $class_observer = false>>\n<<set $graves_asked_question = false>>\n<<set $met_linxi = false>>\n\n<<set $linxi_first_study = false>>\n<<set $linxi_helped_player = false>>\n<<set $linxi_afterclass_talk = false>>\n\n<<set $linxi_romance_available = false>>\n<<set $linxi_romance_started = false>>\n<<set $basketball_known = false>>\n<<set $dorm_info_network = false>>\n<<set $evening_slack = false>>\n<<set $first_dorm_night_done = false>>\n<<set $first_run = false>>\n<<set $heard_rule_loopholes = false>>\n<<set $joined_football = false>>\n<<set $met_yanzi_football = false>>\n<<set $noticed_linxi = false>>\n\n<<set $biggie_dorm_problem = false>>\n<<set $stayed_with_biggie = false>>\n\n<<set $negotiated_laowu = false>>\n<<set $bribe_laowu = false>>\n<<set $want_change_dorm = false>>\n<<set $flag_met_love = false>>\n<<set $flag_climbed_wall = false>>\n/* ===== 暑假行动系统 ===== */\n\n<<set $summer_actions = 0>>\n<<set $summer_action_max = 3>>\n\n<<set $summer_linxi_done = false>>\n<<set $summer_wall_done = false>>\n<<set $summer_love_done = false>>";
const START_PASSAGE = "EVT_002";

let state = {};
let currentPassage = START_PASSAGE;
let historyStack = [];

function sugarExpr(expr){
  return expr
    .replace(/\$([A-Za-z_]\w*)/g, 'state.$1')
    .replace(/\bis\s+not\b/g, '!==')
    .replace(/\bis\b/g, '===')
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!');
}
function runSet(code){
  try { Function('state','Math', sugarExpr(code))(state, Math); }
  catch(e){ console.error('set error:', code, e); }
}
function evalCond(code){
  try { return !!Function('state','Math','return ('+sugarExpr(code)+')')(state, Math); }
  catch(e){ console.error('condition error:', code, e); return false; }
}
function processMacros(source){
  const re = /<<(set|if|elseif|else|\/if)\b([^>]*)>>/g;
  let out='', pos=0, m;
  const stack=[];
  const active=()=>stack.every(x=>x.active);
  while((m=re.exec(source))){
    if(active()) out += source.slice(pos,m.index);
    const kind=m[1], arg=(m[2]||'').trim();
    if(kind==='set'){
      if(active()) runSet(arg);
    }else if(kind==='if'){
      const parent=active(), yes=parent && evalCond(arg);
      stack.push({parent,active:yes,matched:yes});
    }else if(kind==='elseif'){
      const f=stack[stack.length-1];
      if(f){ const yes=f.parent && !f.matched && evalCond(arg); f.active=yes; f.matched=f.matched||yes; }
    }else if(kind==='else'){
      const f=stack[stack.length-1];
      if(f){ const yes=f.parent && !f.matched; f.active=yes; f.matched=true; }
    }else if(kind==='/if'){
      stack.pop();
    }
    pos=re.lastIndex;
  }
  if(active()) out += source.slice(pos);
  return out;
}
function wikiToHtml(source){
  let s = source;
  s = s.replace(/''([\s\S]*?)''/g,'<strong>$1</strong>');
  s = s.replace(/\/\/([\s\S]*?)\/\//g,'<em>$1</em>');
  s = s.replace(/\[\[([^\]|]+?)->([^\]]+?)\]\]/g, (_,label,target)=>
    `<a class="link-internal" href="#" data-target="${escapeAttr(target.trim())}">${label.trim()}</a>`);
  s = s.replace(/\[\[([^\]|]+?)\|([^\]]+?)\]\]/g, (_,label,target)=>
    `<a class="link-internal" href="#" data-target="${escapeAttr(target.trim())}">${label.trim()}</a>`);
  s = s.replace(/\[\[([^\]]+?)\]\]/g, (_,target)=>
    `<a class="link-internal" href="#" data-target="${escapeAttr(target.trim())}">${target.trim()}</a>`);
  // Preserve authored HTML blocks; turn remaining plain-text line breaks into paragraphs/spacing.
  const blocks=s.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean);
  return blocks.map(b=>{
    if(/^<(h\d|div|span|p|ul|ol|table|blockquote|hr|img|section|article)\b/i.test(b) || /<br\s*\/?>/i.test(b) || /<\/[a-z][^>]*>/i.test(b)) return b.replace(/\n/g,'<br>');
    return '<p>'+b.replace(/\n/g,'<br>')+'</p>';
  }).join('');
}
function escapeAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function initNewGame(){
  state={};
  processMacros(STORY_INIT);
  historyStack=[];
  currentPassage=START_PASSAGE;
}
function clamp(v){v=Number(v); if(!Number.isFinite(v)) return 0; return Math.max(0,Math.min(100,v));}
function updateSidebar(){
  const stats=[
    ['学术','academic'],['社交','social'],['武力','powerlevel'],['魅力','charming'],['心理','mentalhealth']
  ];
  document.getElementById('stats').innerHTML=stats.map(([label,key])=>{
    const v=clamp(state[key]);
    return `<div class="stat-row"><span class="label">${label}</span><span class="bar"><i style="width:${v}%"></i></span><span class="value">${Math.round(v)}</span></div>`;
  }).join('');
  document.getElementById('money').textContent = state.money ?? 0;
  document.getElementById('year-sem').textContent = `高${['','一','二','三'][state.year]||state.year||1} · 第${state.semester||1}学期`;
  document.getElementById('passage-id').textContent=currentPassage;
}
function render(name, pushHistory=true){
  if(!PASSAGES[name]){
    document.getElementById('passage').innerHTML=`<div class="error-box">找不到剧情节点：${name}</div>`;
    return;
  }
  if(pushHistory && currentPassage && currentPassage!==name) historyStack.push(currentPassage);
  currentPassage=name;
  const raw=processMacros(PASSAGES[name]);
  document.getElementById('passage').innerHTML=wikiToHtml(raw);
  document.querySelectorAll('[data-target]').forEach(a=>{
    a.addEventListener('click',e=>{e.preventDefault(); render(a.dataset.target,true); window.scrollTo({top:0,behavior:'smooth'});});
  });
  updateSidebar();
}
function saveGame(){
  localStorage.setItem('maple_sim_812_save', JSON.stringify({state,currentPassage,historyStack}));
  pulse('已保存到本机浏览器');
}
function loadGame(){
  try{
    const x=JSON.parse(localStorage.getItem('maple_sim_812_save'));
    if(!x) return pulse('还没有存档');
    state=x.state||{}; historyStack=x.historyStack||[]; currentPassage=x.currentPassage||START_PASSAGE;
    render(currentPassage,false); pulse('存档已读取');
  }catch(e){pulse('存档读取失败');}
}
function restart(){
  if(confirm('确定重新开始？当前未保存进度会丢失。')){initNewGame();render(currentPassage,false);window.scrollTo(0,0);}
}
function goBack(){
  if(!historyStack.length) return pulse('已经是最前面的剧情');
  const prev=historyStack.pop(); currentPassage=prev; render(prev,false);
}
function pulse(msg){
  const el=document.getElementById('toast'); el.textContent=msg; el.style.opacity=1;
  clearTimeout(window.__toastTimer); window.__toastTimer=setTimeout(()=>el.style.opacity=0,1600);
}
window.addEventListener('DOMContentLoaded',()=>{initNewGame();render(currentPassage,false);});
</script>
